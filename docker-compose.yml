services:
  dashboard:
    build:
      context: .
      args:
        NGC_TAG: "24.12-py3"   # change to match your CUDA driver (see Dockerfile)
    image: backtesting-engine:latest
    container_name: backtesting-engine
    # ── GPU access ──────────────────────────────────────────────────────────
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # ── Streamlit dashboard ─────────────────────────────────────────────────
    ports:
      - "8501:8501"
    # ── Mount your data directory so the container can read .dbn files ──────
    volumes:
      - ./data:/app/data
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    restart: unless-stopped

  # ── One-off training job (optional) ────────────────────────────────────────
  # docker compose run --rm trainer python train_and_backtest.py data/nq.dbn.zstd
  trainer:
    build:
      context: .
      args:
        NGC_TAG: "24.12-py3"
    image: backtesting-engine:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./data:/app/data
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    profiles: ["train"]   # only starts when explicitly requested
    entrypoint: ["python"]
    command: ["train_and_backtest.py", "--help"]
